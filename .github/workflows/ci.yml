name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true  # tighten to required once type coverage is real, see docs/decisions

      - name: Test (pytest, with coverage)
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (build only, no push — day 6+)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t dsp-api:ci .
          else
            echo "Dockerfile not added yet (day 6) — skipping build"
          fi