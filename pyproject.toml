[project]
name = "dsp"
version = "0.1.0"
description = "Demand Signal Pipeline: backtested SKU-level demand forecasting with a downstream inventory-policy simulation."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "optuna>=3.6",
    "mlflow>=2.13",
    "pandera>=0.19",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "evidently>=0.4",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff==0.5.0",  # pinned exactly, matching .pre-commit-config.yaml - an
    # unbounded >=0.5 let CI silently install a newer ruff whose import-sort
    # rules disagree with 0.5.0's (caught when CI failed on files that had
    # passed every local/pre-commit check, all run against the 0.5.0 pin)
    "mypy>=1.10",
    "pre-commit>=3.7",
    "kaggle>=1.6",  # CLI used once to pull the M5 dataset, see docs/architecture.md
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dsp --cov-report=term-missing"
